# Resale ERP — Telegram Mini App.
# Один origin: статика фронта и /api с одного домена, поэтому CORS не нужен.

server {
    listen 80;
    listen [::]:80;
    server_name shmotkamanadjer.duckdns.org;

    # HTTP оставлен только под продление сертификата; Telegram работает лишь по https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shmotkamanadjer.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/shmotkamanadjer.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shmotkamanadjer.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/shmotkamanadjer;
    index index.html;

    include snippets/resale-security-headers.conf;

    # Ограничение частоты для API. Защита не от взлома, а от того, что один
    # клиент (или чужой скрипт) займёт единственный воркер: приложение
    # работает на одном процессе uvicorn.
    limit_req_status 429;

    # фото из галереи (лимит приложения — 12 МБ, даём запас)
    client_max_body_size 15m;

    # Хэшированные ассеты неизменяемы — кэшируем надолго.
    location /assets/ {
        expires 1y;
        include snippets/resale-security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=resale_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # С запасом над бюджетом обращений к нейросети (25 c): приложение
        # должно успеть вернуть понятный отказ раньше, чем прокси отдаст 504.
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8020/health;
        access_log off;
    }

    # Демо «бот для модерации Китая» переехало на свой поддомен:
    # https://china.shmotkamanadjer.duckdns.org
    #
    # Держать его на этом же домене было ошибкой. Общий origin означает
    # общие куки, общий localStorage и общий CSP: дыра в демо, которое
    # пишется на ходу, доставала бы до боевого приложения с чужими
    # складами. Старые ссылки уводим на новый адрес.
    location = /china {
        return 301 https://china.shmotkamanadjer.duckdns.org/;
    }
    location /china/ {
        # Префикс срезаем: на поддомене приложение живёт в корне.
        rewrite ^/china/(.*)$ https://china.shmotkamanadjer.duckdns.org/$1 permanent;
    }

    # SPA: любой маршрут отдаёт index.html, но сам он не кэшируется.
    location / {
        try_files $uri $uri/ /index.html;
        include snippets/resale-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
