# Зона ограничения частоты для API ресейл-приложения.
#
# 20 запросов в секунду с адреса при всплеске до 40. Обычная работа в
# такое укладывается с запасом: тяжелее всего открытие склада — список,
# сводка и миниатюры, и это единицы запросов. Ограничение нужно на случай,
# когда один клиент зациклится: приложение живёт в одном процессе uvicorn,
# и занять его целиком может кто угодно.
limit_req_zone $binary_remote_addr zone=resale_api:10m rate=20r/s;
