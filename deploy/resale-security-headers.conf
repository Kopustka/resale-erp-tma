# Защитные заголовки приложения.
#
# Вынесены в сниппет не для красоты: в nginx add_header не наследуется в
# location, где есть свой add_header. Заголовки стояли на уровне server,
# и на самой странице приложения (location / с Cache-Control) они молча
# пропадали — оставаясь только там, где своих add_header не было.
#
# Подключать в КАЖДОМ location, который задаёт собственные заголовки.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Mini App открывается во фрейме Telegram, поэтому не DENY, а перечень.
# telegram.org в script-src обязателен: оттуда грузится telegram-web-app.js,
# сам SDK мини-аппа. Без него приложение не стартует вообще — curl этого не
# показывает, видно только в браузере.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'none'; form-action 'none'" always;
